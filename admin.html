<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Fueeru Game</title>
<link rel="icon" type="image/png" href="webpictures/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- ===== VIEW: Login gate ===== -->
<section id="viewLogin" class="admin-login-wrap">
  <div class="admin-login-card">
    <img src="webpictures/logo.png" alt="Logo Fueeru Game">
    <h1>Admin Panel</h1>
    <p class="sub">Masukkan kata sandi untuk mengelola Fueeru Game.</p>
    <form id="loginForm">
      <input type="password" id="passwordInput" placeholder="Kata sandi" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Masuk</button>
      <div class="admin-error" id="loginError"></div>
    </form>
  </div>
</section>

<!-- ===== Admin shell (setelah login) ===== -->
<div id="adminShell" class="hidden">
  <div class="admin-topbar">
    <div class="brand-mini"><img src="webpictures/logo.png" alt="">Fueeru Game</div>
    <button class="admin-logout" id="btnLogout">Keluar</button>
  </div>

  <div class="admin-wrap">

    <!-- ===== VIEW: Menu utama ===== -->
    <div id="viewMenu" class="admin-panel-card">
      <h1>Admin Panel</h1>
      <div class="admin-menu-grid">
        <button type="button" class="admin-menu-card" id="menuAturPostingan">
          <span class="amc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg>
          </span>
          <span>
            <div class="amc-title">Atur Postingan</div>
            <div class="amc-sub">Tambah, edit, dan hapus postingan game</div>
          </span>
        </button>
        <button type="button" class="admin-menu-card" id="menuLihatLaporan">
          <span class="amc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L14.71 3.86a2 2 0 00-3.42 0z"/></svg>
          </span>
          <span>
            <div class="amc-title">Lihat Laporan</div>
            <div class="amc-sub">Laporan yang masuk dari pengguna</div>
          </span>
        </button>
      </div>
    </div>

    <!-- ===== VIEW: Atur Postingan (list) ===== -->
    <div id="viewPosts" class="admin-panel-card hidden">
      <div class="admin-subheader">
        <button type="button" class="btn-back-mini" id="btnBackFromPosts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1>Atur Postingan</h1>
      </div>
      <div class="admin-search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="postSearchInput" placeholder="Cari judul postingan…">
      </div>
      <button class="btn-add" id="btnAddPost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Tambahkan Postingan
      </button>
      <div id="adminPostList"></div>
      <div class="pagination" id="postsPagination"></div>
    </div>

    <!-- ===== VIEW: Add / Edit form ===== -->
    <div id="viewForm" class="admin-panel-card hidden">
      <div class="admin-subheader">
        <button type="button" class="btn-back-mini" id="btnBackFromForm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 id="formHeading">Tambah Postingan</h1>
      </div>
      <form class="admin-form" id="postForm">
        <label for="fieldTitle">Masukkan Judul</label>
        <input type="text" id="fieldTitle" placeholder="Judul postingan" required>

        <label>Upload Gambar Header</label>
        <div class="upload-box" id="uploadBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <div id="uploadLabel">Klik untuk upload gambar header</div>
          <input type="file" id="fieldImage" accept="image/*">
          <img id="uploadPreview" class="upload-preview" alt="Pratinjau gambar header">
        </div>

        <label for="fieldJenis">Masukkan Jenis Game</label>
        <select id="fieldJenis" required></select>

        <label>Masukkan Genre Game</label>
        <div class="tag-input-wrap" id="genreTagWrap">
          <div id="genreChipsHolder" style="display:contents;"></div>
          <input type="text" id="genreInputField" class="tag-input-field" placeholder="Ketik genre lalu Enter…" autocomplete="off">
          <div class="tag-suggestions" id="genreSuggestions"></div>
        </div>
        <div class="tag-hint">Ketik beberapa huruf untuk melihat genre yang sudah ada, atau ketik genre baru lalu tekan Enter.</div>

        <label>Isi Postingan</label>
        <div class="editor-toolbar" id="editorToolbar">
          <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
          <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
          <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
          <div class="sep"></div>
          <button type="button" data-cmd="justifyLeft" title="Rata kiri">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
          </button>
          <button type="button" data-cmd="justifyCenter" title="Rata tengah">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          </button>
          <button type="button" data-cmd="justifyRight" title="Rata kanan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="sep"></div>
          <button type="button" id="btnInsertImage" title="Sisipkan gambar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
          <button type="button" id="btnInsertLink" title="Sisipkan link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.07 0l2.83-2.83a5 5 0 00-7.07-7.07L11.5 4.5"/><path d="M14 11a5 5 0 00-7.07 0L4.1 13.83a5 5 0 007.07 7.07L12.5 19.5"/></svg>
          </button>
          <input type="file" id="contentImageInput" accept="image/*" class="hidden">
        </div>
        <div class="editor-content" id="editorContent" contenteditable="true" data-placeholder="Tulis isi postingan di sini…"></div>

        <div class="admin-form-actions">
          <button type="button" class="btn-cancel" id="btnCancelForm">Batal</button>
          <button type="submit" class="btn-primary">Publish</button>
        </div>
      </form>
    </div>

    <!-- ===== VIEW: Lihat Laporan ===== -->
    <div id="viewReports" class="admin-panel-card hidden">
      <div class="admin-subheader">
        <button type="button" class="btn-back-mini" id="btnBackFromReports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1>Lihat Laporan</h1>
      </div>
      <div class="admin-search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="reportSearchInput" placeholder="Cari judul, nama, atau isi laporan…">
      </div>
      <button type="button" class="btn-danger-outline" id="btnDeleteAllReports">Hapus Semua</button>
      <div id="adminReportList"></div>
      <div class="pagination" id="reportsPagination"></div>
    </div>

  </div>
</div>

<!-- ===== Modal: Sisipkan Link ===== -->
<div class="modal-backdrop" id="linkModalBackdrop">
  <div class="modal-box">
    <h3>Sisipkan Link</h3>
    <label for="linkUrlInput">Masukkan Link</label>
    <input type="url" id="linkUrlInput" placeholder="https://">
    <label for="linkTextInput">Masukkan Teks</label>
    <input type="text" id="linkTextInput" placeholder="(opsional — jika kosong, link yang tampil)">
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="btnCancelLink">Batal</button>
      <button type="button" class="btn-primary" id="btnConfirmLink">Sisipkan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
