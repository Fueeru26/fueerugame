<main class="container">
  <div class="section-head" id="searchHeading"><h2>Hasil Pencarian</h2></div>

  <form id="pageSearchForm" style="display:flex;gap:8px;margin:0 0 22px;background:var(--surface);border:1.5px solid var(--sky-200);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--shadow-card);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18" style="color:#8fd6fb;flex:0 0 auto;align-self:center;"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="pageSearchInput" placeholder="Cari judul game…" aria-label="Cari game" style="flex:1;border:none;background:transparent;outline:none;font-size:1rem;font-family:inherit;color:var(--ink);padding:8px 0;">
    <button type="submit" class="search-submit" aria-label="Cari">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </form>

  <div class="post-list" id="resultList"></div>
</main>

<footer class="site-footer">
  <div class="foot-brand">Fueeru Game</div>
  Situs kumpulan info &amp; update game buatan komunitas.
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const q = (params.get("q") || "").trim();
  document.getElementById("pageSearchInput").value = q;
  document.title = (q ? `Hasil "${q}"` : "Pencarian") + " — Fueeru Game";

  document.getElementById("pageSearchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const val = document.getElementById("pageSearchInput").value.trim();
    window.location.href = "search.html" + (val ? "?q=" + encodeURIComponent(val) : "");
  });

  const allPosts = loadPosts();
  const resultList = document.getElementById("resultList");
  const heading = document.getElementById("searchHeading");

  if (!q) {
    heading.innerHTML = `<h2>Hasil Pencarian</h2>`;
    resultList.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h3>Mulai pencarianmu</h3>
        <p>Ketik judul game yang ingin kamu cari.</p>
      </div>`;
  } else {
    heading.innerHTML = `<h2>Hasil untuk "${escapeHtml(q)}"</h2>`;
    const results = allPosts.filter((p) =>
      p.title.toLowerCase().includes(q.toLowerCase()) ||
      p.jenis.toLowerCase().includes(q.toLowerCase()) ||
      (p.genres || []).some((g) => g.toLowerCase().includes(q.toLowerCase()))
    );
    if (results.length === 0) {
      resultList.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <h3>Tidak ditemukan</h3>
          <p>Tidak ada game yang cocok dengan "${escapeHtml(q)}". Coba kata kunci lain.</p>
        </div>`;
    } else {
      resultList.innerHTML = results.map((p) => postRowHtml(p)).join("");
    }
  }
</script>

</body>
