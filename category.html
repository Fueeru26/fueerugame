<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const jenisParam = params.get("jenis");
  const genreParam = params.get("genre");
  const catContent = document.getElementById("catContent");
  const allPosts = loadPosts();

  function renderOverview() {
    document.title = "Jenis & Genre — Fueeru Game";
    const genres = getAllGenres();

    catContent.innerHTML = `
      <div class="section-head"><h2>Jenis</h2></div>
      <div class="jenis-grid">
        ${JENIS_LIST.map((j) => `
          <a class="category-card" href="category.html?jenis=${encodeURIComponent(j)}">${escapeHtml(j)}</a>
        `).join("")}
      </div>

      <div class="section-head" style="margin-top:36px;"><h2>Genre</h2></div>
      <div class="genre-tag-list" id="genreTagList"></div>
    `;

    const genreListEl = document.getElementById("genreTagList");
    if (genres.length === 0) {
      genreListEl.innerHTML = `<p style="color:var(--ink-soft);font-size:.9rem;">Belum ada genre. Genre akan muncul otomatis begitu ada postingan yang memakainya.</p>`;
    } else {
      genreListEl.innerHTML = genres
        .map((g) => `<a class="genre-tag" href="category.html?genre=${encodeURIComponent(g)}">${escapeHtml(g)} <span class="count">(${countPostsByGenre(g)})</span></a>`)
        .join("");
    }
  }

  function renderFilteredList(heading, filterFn) {
    document.title = heading + " — Fueeru Game";
    const filtered = allPosts.filter(filterFn).sort((a, b) => new Date(b.date) - new Date(a.date));

    catContent.innerHTML = `
      <div class="section-head"><h2>${escapeHtml(heading)}</h2></div>
      <div class="post-list" id="catPostList"></div>`;

    const listEl = document.getElementById("catPostList");
    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <h3>Belum ada postingan</h3>
          <p>Belum ada game yang cocok. Coba pilihan lain.</p>
        </div>`;
    } else {
      listEl.innerHTML = filtered.map((p) => postRowHtml(p)).join("");
    }
  }

  if (jenisParam) {
    renderFilteredList("Jenis: " + jenisParam, (p) => (p.jenis || "").toLowerCase() === jenisParam.toLowerCase());
  } else if (genreParam) {
    renderFilteredList("Genre: " + genreParam, (p) => (p.genres || []).some((g) => g.toLowerCase() === genreParam.toLowerCase()));
  } else {
    renderOverview();
  }
</script>
