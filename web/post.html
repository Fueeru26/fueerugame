<script>window.ASSET_BASE = "../";</script>
<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const postId = params.get("id");
  const postRaw = postId ? getPostById(postId) : null;
  // Postingan berstatus draft (belum dipublish) tidak boleh bisa diakses
  // langsung lewat URL di halaman publik.
  const post = postRaw && postRaw.published !== false ? postRaw : null;
  const container = document.getElementById("postContent");

  if (post && typeof logPostView === "function") logPostView(post.id);

  if (!post) {
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h3>Postingan tidak ditemukan</h3>
        <p>Postingan yang kamu cari mungkin sudah dihapus atau tautannya salah.</p>
        <p><a href="${assetBase()}index.html" class="back-link" style="justify-content:center;margin-top:10px;">← Kembali ke Beranda</a></p>
      </div>`;
  } else {
    document.title = post.title + " — Fueeru Game";
    const genres = post.genres || [];
    container.innerHTML = `
      <nav class="breadcrumb-nav" aria-label="Breadcrumb">
        <a href="${assetBase()}index.html">Home</a>
        <span class="breadcrumb-sep">›</span>
        <a href="category.html?jenis=${encodeURIComponent(post.jenis)}">${escapeHtml(post.jenis)}</a>
      </nav>
      <h1 class="post-detail-title">${escapeHtml(post.title)}</h1>
      <img class="post-detail-img" src="${resolveAsset(post.thumbnail)}" alt="Header ${escapeHtml(post.title)}" onerror="this.onerror=null;this.src='${assetBase()}webpictures/postplaceholder.webp';">
      <div class="post-detail-content">${post.content}</div>
      <div class="post-detail-meta">
        <span><strong>Tanggal:</strong> ${escapeHtml(formatDate(post.date))}</span>
        <span class="pill">${escapeHtml(post.jenis)}</span>
      </div>
      ${genres.length ? `<div class="genre-chip-row" style="margin-top:12px;">${genres.map((g) => `<span class="genre-chip">${escapeHtml(g)}</span>`).join("")}</div>` : ""}
    `;

    // Spoiler: klik label "SPOILER" untuk buka/tutup (toggle) kotak
    // berisi teks/gambar yang disembunyikan.
    initSpoilers(container);

    // ---------------- Postingan Terkait ----------------
    // Postingan lain dengan jenis yang sama & minimal 1 genre yang sama,
    // maksimal 6, diacak. Kalau tidak ada yang cocok, section tidak ditampilkan.
    const related = getRelatedPosts(post, 6);
    if (related.length > 0) {
      const relatedSection = document.createElement("section");
      relatedSection.setAttribute("aria-labelledby", "relatedHeading");
      relatedSection.style.marginTop = "36px";
      relatedSection.innerHTML = `
        <div class="section-head"><h2 id="relatedHeading">Postingan Terkait</h2></div>
        <div class="carousel-wrap">
          <button class="carousel-arrow prev" id="relatedPrev" aria-label="Geser ke kiri">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="carousel-track" id="relatedTrack"></div>
          <button class="carousel-arrow next" id="relatedNext" aria-label="Geser ke kanan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>`;
      container.appendChild(relatedSection);
      renderCarousel("relatedTrack", related);
      initCarouselArrows("relatedTrack", "relatedPrev", "relatedNext");
    }
  }
</script>
