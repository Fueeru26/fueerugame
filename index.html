<main class="container hero-bubbles">
  <div class="bubble" style="width:60px;height:60px;top:6px;left:6%;"></div>

  <section aria-labelledby="randomHeading">
    <div class="section-head"><h2 id="randomHeading">Random Game</h2></div>
    <div class="carousel-wrap">
      <button class="carousel-arrow prev" id="randomPrev" aria-label="Geser ke kiri">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="carousel-track" id="randomTrack"></div>
      <button class="carousel-arrow next" id="randomNext" aria-label="Geser ke kanan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </section>

  <section aria-labelledby="updateHeading">
    <div class="section-head"><h2 id="updateHeading">New Update Game</h2></div>
    <div class="post-list" id="updateList"></div>
    <div class="pagination" id="updatePagination"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="foot-brand">Fueeru Game</div>
  Situs kumpulan info &amp; update game buatan komunitas.
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const PAGE_SIZE = 10;
  let currentPage = 1;

  const allPosts = loadPosts();

  // Random Game: sampai 10 post acak
  const randomPosts = shuffleArray(allPosts).slice(0, 10);
  renderCarousel("randomTrack", randomPosts);
  initCarouselArrows("randomTrack", "randomPrev", "randomNext");

  // New Update Game: terbaru dulu, dengan pagination (hanya judul, tanggal, jenis)
  const sortedPosts = allPosts.slice().sort((a, b) => new Date(b.date) - new Date(a.date));

  function renderUpdatePage(page) {
    currentPage = page;
    const start = (page - 1) * PAGE_SIZE;
    const pagePosts = sortedPosts.slice(start, start + PAGE_SIZE);
    const list = document.getElementById("updateList");
    if (pagePosts.length === 0) {
      list.innerHTML = `<div class="empty-state"><h3>Belum ada postingan</h3><p>Silakan tambahkan postingan lewat Admin Panel.</p></div>`;
    } else {
      list.innerHTML = pagePosts.map((p) => postRowHtml(p, { showPreview: false, showGenres: false })).join("");
    }
    renderPagination("updatePagination", sortedPosts.length, PAGE_SIZE, currentPage, renderUpdatePage);
  }
  renderUpdatePage(1);
</script>
