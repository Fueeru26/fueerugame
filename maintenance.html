<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){try{var t=localStorage.getItem('fueeru_theme');if(!t)t=localStorage.getItem('fueeru_theme_default_cache');if(t!=='light'){document.documentElement.classList.add('dark');}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedang Dalam Perbaikan — Fueeru Game</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="webpictures/logo.webp">
<meta name="theme-color" content="#2fa8e0">
<link rel="stylesheet" href="css/style.css">
<style>
  .maint-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .maint-box { max-width: 440px; }
  .maint-logo {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    box-shadow: var(--shadow-card);
    margin-bottom: 20px;
  }
  .maint-box h1 {
    font-size: 1.4rem;
    color: var(--sky-700);
    margin-bottom: 12px;
  }
  .maint-box p {
    color: var(--ink-soft);
    line-height: 1.5;
    font-size: .96rem;
    margin-bottom: 8px;
  }
  .maint-reason {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--sky-100);
    border-radius: var(--radius-sm);
    color: var(--ink);
    font-size: .9rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="maint-wrap">
    <div class="maint-box">
      <img class="maint-logo" src="webpictures/logo.webp" alt="Logo Fueeru Game">
      <h1>Situs Sedang Dalam Perbaikan</h1>
      <p>Maaf, Fueeru Game sedang dalam masa maintenance. Kami akan kembali online secepatnya.</p>
      <div class="maint-reason" id="maintReason">__MAINTENANCE_REASON__</div>
    </div>
  </div>
  <script>
    var el = document.getElementById("maintReason");
    if (!el.textContent.trim()) el.style.display = "none";
  </script>
</body>
</html>
